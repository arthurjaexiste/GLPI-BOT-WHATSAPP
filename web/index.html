<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Sistema - Bot GLPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0b0f19] bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#1e1b4b] text-white min-h-screen flex flex-col">
    <!-- Header/Navbar -->
    <header class="bg-gray-900/60 backdrop-blur-md border-b border-white/10 sticky top-0 z-50 w-full px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <span class="text-3xl animate-pulse">🤖</span>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">GLPI-BOT</h1>
                <p class="text-xs text-gray-400">Painel de Controle Inteligente</p>
            </div>
        </div>
        
        <!-- Navigation Links -->
        <nav class="flex items-center gap-2 bg-black/40 p-1 border border-white/10 rounded-xl">
            <a href="/" class="px-4 py-2 text-xs font-semibold rounded-lg transition duration-200 text-white bg-white/10 border border-white/5">
                📊 Status
            </a>
            <a href="/flow" class="px-4 py-2 text-xs font-semibold rounded-lg transition duration-200 text-gray-400 hover:text-white hover:bg-white/5">
                💬 Fluxo do Bot
            </a>
            <a href="/config" class="px-4 py-2 text-xs font-semibold rounded-lg transition duration-200 text-gray-400 hover:text-white hover:bg-white/5">
                🔧 Configurações
            </a>
            <a href="/messages" class="px-4 py-2 text-xs font-semibold rounded-lg transition duration-200 text-gray-400 hover:text-white hover:bg-white/5">
                ✉️ Mensagens
            </a>
        </nav>

        <!-- Action / Logout -->
        <div class="flex items-center gap-3">
            <a href="/logout" class="px-4 py-2 text-xs font-semibold text-red-400 hover:text-white bg-red-950/20 hover:bg-red-900/40 border border-red-900/30 hover:border-red-500/50 rounded-lg transition duration-200">
                🚪 Sair
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <!-- Status Connection Card -->
        <div class="bg-gray-900/60 backdrop-blur-md border border-white/10 rounded-2xl p-8 shadow-2xl w-full max-w-md flex flex-col items-center">
            <h2 class="text-xl font-bold mb-1 flex items-center gap-2 text-indigo-400">
                📶 Conexão WhatsApp
            </h2>
            <p class="text-xs text-gray-400 mb-6 text-center font-normal">Status atual da conexão do bot na rede</p>

            <!-- QR Code / Status Container -->
            <div class="bg-black/40 border border-white/5 p-6 rounded-xl w-full flex flex-col items-center justify-center min-h-[260px] shadow-inner">
                <!-- Div onde o JS vai injetar a imagem do QR Code -->
                <div id="qrcode" class="flex justify-center items-center rounded-lg overflow-hidden"></div>
                
                <!-- Div onde o JS vai injetar os textos de status -->
                <div id="qr-status" class="mt-4 text-center font-semibold text-sm">
                    Verificando...
                </div>
            </div>
        </div>
    </main>

    <!-- Importando o Script -->
    <script src="/static/js/script.js"></script>
</body>
</html>
