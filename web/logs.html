<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Logs - GLPI-BOT</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=4.0">
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased">

    <!-- Header Navbar -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 w-full px-4 py-2.5 flex flex-col md:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <img src="/static/img/logo.png" alt="Logo GLPI-BOT" class="w-7 h-7 object-contain">
            <div>
                <h1 class="text-xs font-bold text-zinc-100 uppercase tracking-wider">GLPI-BOT</h1>
                <p class="text-[10px] text-zinc-400">Painel de Gerenciamento TI</p>
            </div>
        </div>

        <nav class="flex items-center gap-1 bg-zinc-950 p-1 border border-zinc-800 rounded">
            <a href="/" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
                Status
            </a>
            <a href="/flow" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
                Fluxo do Bot
            </a>
            <a href="/config" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
                Configurações
            </a>
            <a href="/messages" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
                Mensagens
            </a>
            <a href="/chats" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
                Conversas
            </a>
            <a href="/logs" class="px-3 py-1.5 text-xs font-semibold rounded text-zinc-100 bg-zinc-800 border border-zinc-700">
                Logs
            </a>
        </nav>

        <div class="flex items-center gap-2.5">
            <div id="user-badge-header" class="hidden md:flex items-center gap-2 bg-zinc-950 border border-zinc-800 px-2.5 py-1 rounded text-xs">
                <span id="user-badge-role" class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-zinc-800 text-zinc-300">...</span>
                <span id="user-badge-name" class="text-zinc-200 font-bold">...</span>
            </div>
            <a href="/logout" class="px-3 py-1.5 text-xs font-semibold text-rose-400 hover:text-rose-300 bg-rose-950/40 border border-rose-900/60 rounded transition">
                Sair
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col gap-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded p-4 flex flex-col gap-3">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-zinc-800 pb-3">
                <div>
                    <h2 class="text-xs font-bold text-zinc-100 uppercase tracking-wider">
                        Console de Logs em Tempo Real
                    </h2>
                    <p class="text-[11px] text-zinc-400 mt-0.5">Auditoria de eventos, rotinas internas e requisições da API GLPI</p>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <select id="limitSelect" onchange="fetchLogs()"
                        class="bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-xs text-zinc-100 focus:outline-none">
                        <option value="50">Últimas 50 linhas</option>
                        <option value="150" selected>Últimas 150 linhas</option>
                        <option value="300">Últimas 300 linhas</option>
                        <option value="500">Últimas 500 linhas</option>
                    </select>

                    <select id="intervalSelect" onchange="setupAutoRefresh()"
                        class="bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-xs text-zinc-100 focus:outline-none">
                        <option value="0">Sem auto-atualização</option>
                        <option value="2000" selected>Atualizar a cada 2s</option>
                        <option value="5000">Atualizar a cada 5s</option>
                        <option value="10000">Atualizar a cada 10s</option>
                    </select>
                </div>
            </div>

            <!-- Toolbar Controls -->
            <div class="flex items-center justify-between flex-wrap gap-3 text-xs text-zinc-400">
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-zinc-300">
                        <input type="checkbox" id="autoScrollCheck" checked
                            class="rounded border-zinc-800 bg-zinc-950">
                        <span class="text-xs font-medium">Rolar Automaticamente</span>
                    </label>
                    <div class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 px-2.5 py-1 rounded">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500" id="status-pulse"></span>
                        <span id="status-text" class="text-[10px] font-bold text-zinc-300 uppercase">Monitorando</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearConsole()"
                        class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded text-zinc-200 font-semibold transition text-xs cursor-pointer">
                        Limpar Tela
                    </button>
                    <a href="/api/logs?download=true" target="_blank"
                        class="px-3 py-1.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-950 font-bold rounded transition text-xs">
                        Baixar Log Completo
                    </a>
                </div>
            </div>

            <!-- Terminal Log Area -->
            <div class="relative mt-1">
                <div id="terminal"
                    class="terminal-font w-full h-[520px] bg-zinc-950 border border-zinc-800 rounded p-4 overflow-y-auto text-xs leading-relaxed text-zinc-300 whitespace-pre-wrap select-text font-mono">
                    Carregando logs do sistema...</div>
            </div>

        </div>
    </main>

    <script src="/static/js/auth-check.js?v=4.0"></script>
    <script src="/static/js/logs.js?v=4.0"></script>
</body>

</html>
