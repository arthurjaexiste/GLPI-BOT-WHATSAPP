<!-- VIEW HTML: login.html - Página do Painel Administrativo do GLPI-BOT -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot GLPI</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=1.6">
</head>

<body class="text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden select-none">
    <!-- Interactive Canvas background -->
    <canvas id="interactive-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Ambient light glow effects (Monochrome/Gray theme) -->
    <div id="glow-spotlight"
        class="absolute w-[450px] h-[450px] bg-white/[0.02] rounded-full blur-[110px] pointer-events-none z-0 transition-all duration-300 ease-out"
        style="top: 20%; left: 40%;"></div>
    <div
        class="absolute bottom-1/4 left-1/3 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-white/[0.01] rounded-full blur-[100px] pointer-events-none z-0">
    </div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-md flex flex-col gap-8 relative z-10 select-text">
        <div class="text-center">
            <div class="relative inline-block mb-4">
                <div class="absolute inset-0 bg-white/[0.02] rounded-full blur-xl animate-pulse"></div>
                <img src="/static/img/logo.png" alt="Logo"
                    class="w-36 h-36 mx-auto object-contain relative z-10 drop-shadow-[0_4px_20px_rgba(255,255,255,0.08)]">
            </div>
            <h1
                class="text-2xl font-bold bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">
                Acesso GLPI-BOT</h1>
            <p class="text-xs text-zinc-400 mt-1.5">Insira suas credenciais para gerenciar o bot</p>
        </div>

        {{if .Error}}
        <div
            class="bg-rose-500/10 border border-rose-500/25 text-rose-300 px-4 py-3.5 rounded-xl text-xs flex items-center gap-2.5 animate-bounce">
            <span class="text-sm">⚠️</span>
            <span class="font-medium">{{.Error}}</span>
        </div>
        {{end}}


        <!-- Formulário de entrada de dados administrativos -->
        <form action="/login" method="POST" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Usuário</label>
                <input name="username" type="text" placeholder="Ex: admin" required
                    class="focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20">
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Senha</label>
                <input name="password" type="password" placeholder="Sua senha" required
                    class="focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20">
            </div>
            <button
                class="mt-3 bg-white hover:bg-zinc-200 text-black border border-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-0.5"
                type="submit">
                Entrar no Painel
            </button>
        </form>
    </div>

    <!-- Interactive Canvas & Spotlight Logic -->
    <script src="/static/js/login.js?v=1.6"></script>
</body>

</html>
