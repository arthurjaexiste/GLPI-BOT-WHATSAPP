<!-- VIEW HTML: login.html - Página do Painel Administrativo do GLPI-BOT -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot GLPI</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=1.6">
</head>
<body class="text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden select-none">
    <!-- Interactive Canvas background -->
    <canvas id="interactive-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Ambient light glow effects (Monochrome/Gray theme) -->
    <div id="glow-spotlight" class="absolute w-[450px] h-[450px] bg-white/[0.02] rounded-full blur-[110px] pointer-events-none z-0 transition-all duration-300 ease-out" style="top: 20%; left: 40%;"></div>
    <div class="absolute bottom-1/4 left-1/3 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-white/[0.01] rounded-full blur-[100px] pointer-events-none z-0"></div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-md flex flex-col gap-8 relative z-10 select-text">
        <div class="text-center">
            <div class="relative inline-block mb-4">
                <div class="absolute inset-0 bg-white/[0.02] rounded-full blur-xl animate-pulse"></div>
                <img src="/static/img/logo.png" alt="Logo" class="w-36 h-36 mx-auto object-contain relative z-10 drop-shadow-[0_4px_20px_rgba(255,255,255,0.08)]">
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">Acesso GLPI-BOT</h1>
            <p class="text-xs text-zinc-400 mt-1.5">Insira suas credenciais para gerenciar o bot</p>
        </div>

        {{if .Error}}
        <div class="bg-rose-500/10 border border-rose-500/25 text-rose-300 px-4 py-3.5 rounded-xl text-xs flex items-center gap-2.5 animate-bounce">
            <span class="text-sm">⚠️</span>
            <span class="font-medium">{{.Error}}</span>
        </div>
        {{end}}

        
<!-- Formulário de entrada de dados administrativos -->
<form action="/login" method="POST" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Usuário</label>
                <input name="username" type="text" placeholder="Ex: admin" required class="focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20">
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Senha</label>
                <input name="password" type="password" placeholder="Sua senha" required class="focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20">
            </div>
            <button class="mt-3 bg-white hover:bg-zinc-200 text-black border border-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-0.5" type="submit">
                Entrar no Painel
            </button>
        </form>
    </div>

    <!-- Interactive Canvas & Spotlight Logic -->
    <script>
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        const spotlight = document.getElementById('glow-spotlight');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        let mouse = { x: null, y: null, active: false };

        // Handle Resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        // Track Mouse
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;

            // Update smooth ambient spotlight position
            if (spotlight) {
                spotlight.style.left = `${mouse.x - 225}px`;
                spotlight.style.top = `${mouse.y - 225}px`;
            }
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // Track Click Explosion
        window.addEventListener('click', (e) => {
            // Burst of sparks from click location
            const burstCount = 20;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(e.clientX, e.clientY, true, false));
            }
        });

        // Particle Class
        class Particle {
            constructor(x, y, isSpark = false, isTrail = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : Math.random() * height;
                this.isSpark = isSpark;
                this.isTrail = isTrail;
                this.radius = isSpark ? Math.random() * 2 + 1.2 : (isTrail ? Math.random() * 1.5 + 0.8 : Math.random() * 1.5 + 0.8);
                
                if (isSpark) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 1.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.02 + 0.015;
                } else if (isTrail) {
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.03 + 0.02;
                } else {
                    this.baseVx = (Math.random() - 0.5) * 0.4;
                    this.baseVy = (Math.random() - 0.5) * 0.4;
                    this.vx = this.baseVx;
                    this.vy = this.baseVy;
                    this.life = 1.0;
                    this.decay = 0;
                }
            }

            update() {
                if (this.isSpark || this.isTrail) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.97; // Friction
                    this.vy *= 0.97;
                    this.life -= this.decay;
                } else {
                    // Interactive physics - antigravity repulsion
                    if (mouse.active && mouse.x !== null) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        const limit = 160;

                        if (dist < limit) {
                            // Repel from mouse to create an antigravity bubble effect
                            const force = (limit - dist) / limit;
                            const angle = Math.atan2(dy, dx);
                            this.vx -= Math.cos(angle) * force * 0.5;
                            this.vy -= Math.sin(angle) * force * 0.5;
                        }
                    }

                    // Add simple damping and return to base speed
                    this.vx += (this.baseVx - this.vx) * 0.05;
                    this.vy += (this.baseVy - this.vy) * 0.05;

                    this.x += this.vx;
                    this.y += this.vy;

                    // Screen Boundary Wrap-around
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }

            draw() {
                ctx.save();
                if (this.isSpark) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffffff';
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                } else if (this.isTrail) {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#a1a1aa';
                    ctx.fillStyle = `rgba(161, 161, 170, ${this.life * 0.5})`;
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            // Base background wandering particles
            const count = Math.min(Math.floor((width * height) / 16000), 90);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function drawLines() {
            // Draw lines only between background wandering particles to avoid clutter
            const bgParticles = particles.filter(p => !p.isSpark && !p.isTrail);
            for (let i = 0; i < bgParticles.length; i++) {
                for (let j = i + 1; j < bgParticles.length; j++) {
                    const dx = bgParticles[i].x - bgParticles[j].x;
                    const dy = bgParticles[i].y - bgParticles[j].y;
                    const dist = Math.hypot(dx, dy);
                    const limit = 110;

                    if (dist < limit) {
                        const alpha = (1 - (dist / limit)) * 0.06;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(bgParticles[i].x, bgParticles[i].y);
                        ctx.lineTo(bgParticles[j].x, bgParticles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Filter out dead particles
            particles = particles.filter(p => !((p.isSpark || p.isTrail) && p.life <= 0));

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawLines();

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
