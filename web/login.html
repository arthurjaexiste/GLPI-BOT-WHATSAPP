<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot GLPI</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=1.6">
    <style>
        /* Sleek card border animation & focus transition */
        .premium-input {
            background: rgba(9, 9, 11, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 14px !important;
            padding: 14px 18px !important;
            font-size: 0.875rem !important;
            color: #ffffff !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .premium-input:focus {
            border-color: #ffffff !important;
            box-shadow: 0 0 0 1px #ffffff, 0 10px 20px -10px rgba(255, 255, 255, 0.1) !important;
            background: #000000 !important;
        }
        /* Custom card glow outline */
        .login-card {
            background: rgba(9, 9, 11, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden bg-black">
    <!-- Interactive background canvas -->
    <canvas id="cosmic-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Smooth tracking background glow spotlight -->
    <div id="glow-spotlight" class="absolute w-[500px] h-[500px] bg-white/[0.015] rounded-full blur-[120px] pointer-events-none z-0 transition-all duration-500 ease-out" style="top: 20%; left: 30%;"></div>

    <!-- Login Container Card -->
    <div class="login-card p-10 md:p-12 rounded-[28px] w-full max-w-[420px] flex flex-col gap-8 relative z-10 backdrop-blur-2xl">
        <div class="text-center flex flex-col items-center">
            <!-- Sleek Logo with subtle backglow -->
            <div class="relative w-20 h-20 mb-5 flex items-center justify-center bg-zinc-950 border border-white/10 rounded-2xl shadow-xl overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-50"></div>
                <img src="/static/img/logo.png" alt="Logo" class="w-12 h-12 object-contain relative z-10 drop-shadow-[0_2px_8px_rgba(255,255,255,0.15)] transition duration-500 group-hover:scale-105">
            </div>
            
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-b from-white to-zinc-400 bg-clip-text text-transparent uppercase text-xs tracking-widest">Painel Administrativo</h1>
            <h2 class="text-2xl font-bold tracking-tight mt-1 text-white">Acesse sua Conta</h2>
            <p class="text-xs text-zinc-400 mt-2 font-normal">Insira seu usuário e senha do GLPI-BOT</p>
        </div>

        {{if .Error}}
        <div class="bg-rose-950/20 border border-rose-500/30 text-rose-300 px-4 py-3.5 rounded-xl text-xs flex items-center gap-2.5 animate-bounce">
            <span class="text-sm">⚠️</span>
            <span class="font-semibold">{{.Error}}</span>
        </div>
        {{end}}

        <form action="/login" method="POST" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Usuário</label>
                <input name="username" type="text" placeholder="Ex: admin" required class="premium-input focus:outline-none">
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Senha</label>
                <input name="password" type="password" placeholder="••••••••" required class="premium-input focus:outline-none">
            </div>
            
            <button class="mt-4 bg-white hover:bg-zinc-200 text-black border border-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 hover:scale-[1.01] active:translate-y-0 active:scale-100 flex items-center justify-center gap-2" type="submit">
                <span>Entrar no Sistema</span>
                <span class="text-sm">→</span>
            </button>
        </form>
    </div>

    <!-- Cosmic Starfield & Water Ripple Wave Animation Script -->
    <script>
        const canvas = document.getElementById('cosmic-canvas');
        const ctx = canvas.getContext('2d');
        const spotlight = document.getElementById('glow-spotlight');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        let ripples = [];
        let mouse = { x: null, y: null, active: false };

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        // Track mouse movement
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;

            // Spawn dynamic fine trails (cosmic stardust)
            if (Math.random() < 0.4) {
                particles.push(new Particle(mouse.x, mouse.y, false, true));
            }

            // Smoothly slide ambient glow behind the card
            if (spotlight) {
                spotlight.style.left = `${mouse.x - 250}px`;
                spotlight.style.top = `${mouse.y - 250}px`;
            }
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // Create ripple wave and stardust burst on click
        window.addEventListener('click', (e) => {
            // Ripple wave
            ripples.push({
                x: e.clientX,
                y: e.clientY,
                radius: 2,
                maxRadius: 180,
                opacity: 0.3
            });

            // Burst stardust
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(e.clientX, e.clientY, true, false));
            }
        });

        class Particle {
            constructor(x, y, isSpark = false, isTrail = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : Math.random() * height;
                this.isSpark = isSpark;
                this.isTrail = isTrail;
                
                // Keep particles smaller and elegant
                this.radius = isSpark ? Math.random() * 1.5 + 0.8 : (isTrail ? Math.random() * 1.2 + 0.5 : Math.random() * 1.0 + 0.5);
                
                if (isSpark) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2.5 + 1.0;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.015 + 0.01;
                } else if (isTrail) {
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.02 + 0.01;
                } else {
                    this.baseVx = (Math.random() - 0.5) * 0.25; // Slower drifting
                    this.baseVy = (Math.random() - 0.5) * 0.25;
                    this.vx = this.baseVx;
                    this.vy = this.baseVy;
                    this.life = 1.0;
                    this.decay = 0;
                }
            }

            update() {
                if (this.isSpark || this.isTrail) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.life -= this.decay;
                } else {
                    // Slow hover repulsion force
                    if (mouse.active && mouse.x !== null) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        const limit = 160;

                        if (dist < limit) {
                            const force = (limit - dist) / limit;
                            const angle = Math.atan2(dy, dx);
                            this.vx -= Math.cos(angle) * force * 0.3;
                            this.vy -= Math.sin(angle) * force * 0.3;
                        }
                    }

                    this.vx += (this.baseVx - this.vx) * 0.03;
                    this.vy += (this.baseVy - this.vy) * 0.03;
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }

            draw() {
                ctx.save();
                if (this.isSpark) {
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#ffffff';
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                } else if (this.isTrail) {
                    ctx.fillStyle = `rgba(212, 212, 216, ${this.life * 0.4})`;
                } else {
                    // Starfield subtle glow
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            // Subtle, elegant count
            const count = Math.min(Math.floor((width * height) / 20000), 75);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function drawRipples() {
            ripples.forEach((rp, idx) => {
                rp.radius += 3.5;
                rp.opacity = (1 - (rp.radius / rp.maxRadius)) * 0.35;

                ctx.strokeStyle = `rgba(255, 255, 255, ${rp.opacity})`;
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
                ctx.stroke();

                if (rp.radius >= rp.maxRadius) {
                    ripples.splice(idx, 1);
                }
            });
        }

        function drawLines() {
            const bgParticles = particles.filter(p => !p.isSpark && !p.isTrail);
            for (let i = 0; i < bgParticles.length; i++) {
                for (let j = i + 1; j < bgParticles.length; j++) {
                    const dx = bgParticles[i].x - bgParticles[j].x;
                    const dy = bgParticles[i].y - bgParticles[j].y;
                    const dist = Math.hypot(dx, dy);
                    const limit = 100;

                    if (dist < limit) {
                        const alpha = (1 - (dist / limit)) * 0.04;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(bgParticles[i].x, bgParticles[i].y);
                        ctx.lineTo(bgParticles[j].x, bgParticles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            particles = particles.filter(p => !((p.isSpark || p.isTrail) && p.life <= 0));

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawLines();
            drawRipples();

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
