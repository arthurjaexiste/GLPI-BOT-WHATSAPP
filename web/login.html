<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação do Sistema - GLPI-BOT</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=4.0">
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Caixa de Login Centralizada - Dark Mode -->
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded p-6 flex flex-col gap-5">
        
        <div class="flex items-center gap-3 border-b border-zinc-800 pb-4">
            <img src="/static/img/logo.png" alt="Logo GLPI-BOT" class="w-8 h-8 object-contain">
            <div>
                <h1 class="text-xs font-bold text-zinc-100 uppercase tracking-wider">GLPI-BOT</h1>
                <p class="text-xs text-zinc-400">Painel de Gerenciamento TI</p>
            </div>
        </div>

        {{if .Error}}
        <div class="p-3 bg-red-950/60 border border-red-800/80 rounded text-red-300 text-xs flex items-center gap-2">
            <span class="text-base">⚠️</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <form action="/login" method="POST" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label for="username" class="text-xs font-semibold text-zinc-400 uppercase tracking-wide">Usuário</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu login" autocomplete="username"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-xs text-zinc-100 focus:border-zinc-600 focus:outline-none">
            </div>

            <div class="flex flex-col gap-1">
                <label for="password" class="text-xs font-semibold text-zinc-400 uppercase tracking-wide">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha" autocomplete="current-password"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-xs text-zinc-100 focus:border-zinc-600 focus:outline-none">
            </div>

            <button type="submit" class="w-full mt-2 py-2 px-4 bg-zinc-100 hover:bg-zinc-200 text-zinc-950 font-bold text-xs uppercase tracking-wider rounded transition cursor-pointer">
                Entrar
            </button>
        </form>

        <div class="border-t border-zinc-800 pt-3 text-center">
            <span class="text-[11px] text-zinc-500">Sistema Interno de Suporte ao Usuário</span>
        </div>
    </div>

</body>

</html>
