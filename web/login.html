<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot GLPI</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-[#09090b] bg-gradient-to-br from-[#09090b] via-[#18181b] to-[#27272a] text-white min-h-screen flex items-center justify-center p-6">
    <div class="bg-zinc-900/60 backdrop-blur-md border border-white/10 p-8 rounded-2xl w-full max-w-md shadow-2xl flex flex-col gap-6">
        <div class="text-center">
            <img src="/static/img/logo.png" alt="Logo" class="w-16 h-16 mx-auto mb-3 object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.15)]">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-zinc-100 via-zinc-300 to-zinc-500 bg-clip-text text-transparent">Acesso GLPI-BOT</h1>
            <p class="text-xs text-gray-400 mt-1">Insira suas credenciais para gerenciar o bot</p>
        </div>

        {{if .Error}}
        <div class="bg-red-950/50 border border-red-500/30 text-red-300 px-4 py-3 rounded-lg text-xs flex items-center gap-2">
            <span>⚠️</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <form action="/login" method="POST" class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Usuário</label>
                <input name="username" type="text" placeholder="Ex: admin" required class="bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition duration-200">
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Senha</label>
                <input name="password" type="password" placeholder="Sua senha" required class="bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition duration-200">
            </div>
            <button class="mt-2 bg-gradient-to-r from-zinc-700 to-zinc-800 hover:from-zinc-600 hover:to-zinc-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg hover:shadow-zinc-500/20 transition-all duration-200 transform hover:-translate-y-0.5" type="submit">
                Entrar
            </button>
        </form>
    </div>
</body>
</html>
